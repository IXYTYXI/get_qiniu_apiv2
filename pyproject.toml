[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qiniu-get-v2"
version = "0.1.0"
description = "Fetch livestream recordings and danmaku, segment audio, and sync to Feishu Base"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "python-dotenv>=1,<2", "filelock>=3.16,<4", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
qiniu-get = "qiniu_get.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
